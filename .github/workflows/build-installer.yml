name: Build Obidji Jugu installers

on:
  workflow_dispatch:
    inputs:
      license_path:
        description: Optional application license path (leave empty to omit)
        required: false
        type: string

permissions:
  contents: read

env:
  NATID_SDK_TAG: v4.2.1
  NATID_SDK_BUILD: '20260710'

jobs:
  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check application license
        env:
          LICENSE_PATH: ${{ inputs.license_path }}
        run: |
          if ($env:LICENSE_PATH -and -not (Test-Path -LiteralPath $env:LICENSE_PATH -PathType Leaf)) {
            throw "Commit the approved application license and supply its repository path."
          }

      - name: Install matching natID SDK headers and binaries
        run: |
          git clone --depth 1 --branch $env:NATID_SDK_TAG https://github.com/idzafic/natID.git "$env:USERPROFILE\natID"
          if ($LASTEXITCODE -ne 0) { throw 'SDK clone failed.' }
          New-Item -ItemType Junction -Path "$env:USERPROFILE\natID.SDK" -Target "$env:USERPROFILE\natID\natID.SDK" | Out-Null
          New-Item -ItemType Junction -Path "$env:USERPROFILE\natID.Utils" -Target "$env:USERPROFILE\natID\natID.Utils" | Out-Null
          $archive = "$env:RUNNER_TEMP\natid.7z"
          curl.exe --fail --location --retry 3 --output $archive "https://github.com/idzafic/natID/releases/download/$env:NATID_SDK_TAG/bin_win_x64_$env:NATID_SDK_BUILD.7z"
          if ($LASTEXITCODE -ne 0) { throw 'SDK download failed.' }
          & "$env:ProgramFiles\7-Zip\7z.exe" x -y "-o$env:USERPROFILE\natID.SDK\bin" $archive
          if ($LASTEXITCODE -ne 0) { throw 'SDK extraction failed.' }
          New-Item -ItemType Directory -Force "$env:USERPROFILE\natID.RAMDisk" | Out-Null
          subst.exe R: "$env:USERPROFILE\natID.RAMDisk"
          if ($LASTEXITCODE -ne 0) { throw 'RAMDisk mapping failed.' }

      - name: Generate icons and compile Release
        run: |
          python -m pip install Pillow
          if ($LASTEXITCODE -ne 0) { throw 'Pillow installation failed.' }
          python tools/generate_icons.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed.' }
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 "-DNATID_SDK_ROOT=$env:USERPROFILE\natID.SDK"
          if ($LASTEXITCODE -ne 0) { throw 'CMake configuration failed.' }
          cmake --build build --config Release --target obidji-jugu --parallel 4
          if ($LASTEXITCODE -ne 0) { throw 'Compilation failed.' }

      - name: Package installer
        env:
          LICENSE_PATH: ${{ inputs.license_path }}
        run: |
          $licenseArgs = @()
          if ($env:LICENSE_PATH) { $licenseArgs = @('--license', $env:LICENSE_PATH) }
          python tools/package_installer.py --sdk "$env:USERPROFILE\natID.SDK" --collector "$env:USERPROFILE\natID.Utils\windows\SetupCollector.exe" --executable-dir "$env:USERPROFILE\natID.RAMDisk\Out\The_Travelling_Salesman\Release" @licenseArgs --output installer-output
          if ($LASTEXITCODE -ne 0) { throw 'Installer packaging failed.' }

      - name: Upload installer files
        uses: actions/upload-artifact@v4
        with:
          name: Obidji-Jugu-Windows
          path: installer-output/
          if-no-files-found: error

  unix:
    name: ${{ matrix.label }} installer
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macOS
            arch: arm64
            label: macOS-Silicon
            collector: macOS/arm64/SetupCollector
          - runner: macos-15-intel
            platform: macOS
            arch: x64
            label: macOS-Intel
            collector: macOS/x64/SetupCollector
          - runner: ubuntu-24.04
            platform: linux
            arch: x64
            label: Linux
            collector: linux/SetupCollector
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      LICENSE_PATH: ${{ inputs.license_path }}
      SDK_PLATFORM: ${{ matrix.platform }}
      SDK_ARCH: ${{ matrix.arch }}
      COLLECTOR: ${{ matrix.collector }}
      PACKAGE_LABEL: ${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install -y build-essential cmake git p7zip-full zip libgtk-4-dev libadwaita-1-dev
          else
            brew list sevenzip >/dev/null 2>&1 || brew install sevenzip
          fi
          python -m pip install Pillow
          if [[ -n "$LICENSE_PATH" ]]; then test -f "$LICENSE_PATH"; fi

      - name: Install matching natID SDK headers and binaries
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$NATID_SDK_TAG" https://github.com/idzafic/natID.git "$HOME/natID"
          ln -s "$HOME/natID/natID.SDK" "$HOME/natID.SDK"
          ln -s "$HOME/natID/natID.Utils" "$HOME/natID.Utils"
          archive="$RUNNER_TEMP/natid.7z"
          curl --fail --location --retry 3 --output "$archive" "https://github.com/idzafic/natID/releases/download/$NATID_SDK_TAG/bin_${SDK_PLATFORM}_${SDK_ARCH}_${NATID_SDK_BUILD}.7z"
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            7z x -y -o"$HOME/natID.SDK/bin" "$archive"
            sudo mkdir -p /media
            mount_path=/media/RAMDisk
          else
            7zz x -y -o"$HOME/natID.SDK/bin" "$archive"
            mount_path=/Volumes/RAMDisk
          fi
          mkdir -p "$HOME/natID.RAMDisk"
          sudo ln -s "$HOME/natID.RAMDisk" "$mount_path"

      - name: Generate icons and compile Release
        run: |
          set -euo pipefail
          python tools/generate_icons.py
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DNATID_SDK_ROOT="$HOME/natID.SDK"
          cmake --build build --config Release --target obidji-jugu --parallel 4

      - name: Package installer
        run: |
          set -euo pipefail
          license_args=()
          if [[ -n "$LICENSE_PATH" ]]; then license_args=(--license "$LICENSE_PATH"); fi
          chmod +x "$HOME/natID.Utils/$COLLECTOR"
          export LD_LIBRARY_PATH="$HOME/natID.SDK/bin/lib:${LD_LIBRARY_PATH:-}"
          export DYLD_LIBRARY_PATH="$HOME/natID.SDK/bin/lib:${DYLD_LIBRARY_PATH:-}"
          python tools/package_installer.py --sdk "$HOME/natID.SDK" --collector "$HOME/natID.Utils/$COLLECTOR" --executable-dir "$HOME/natID.RAMDisk/Out/The_Travelling_Salesman/Release" "${license_args[@]}" --output installer-output

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bundle="$(find installer-output -type d -name '*.app' -print -quit)"
          test -n "$bundle"
          app="$RUNNER_TEMP/Obidji Jugu.app"
          ditto "$bundle" "$app"
          codesign --force --deep --sign - "$app"
          xattr -cr "$app"
          mkdir -p artifacts
          ditto -c -k --keepParent --sequesterRsrc "$app" "artifacts/Obidji-Jugu-${PACKAGE_LABEL}.zip"

      - name: Embed Linux application icons and archive package
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          deb="$(find installer-output -type f -name '*.deb' -print -quit)"
          test -n "$deb"
          package="$RUNNER_TEMP/obidji-jugu-deb"
          dpkg-deb -R "$deb" "$package"
          for size in 16 32 48 128 256; do
            icon_dir="$package/usr/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$icon_dir"
            cp "res/appIcon/lnxApp${size}.png" "$icon_dir/obidji-jugu.png"
          done
          while IFS= read -r desktop_file; do
            sed -i 's/^Name=.*/Name=Obidji Jugu/' "$desktop_file"
            sed -i 's/^Icon=.*/Icon=obidji-jugu/' "$desktop_file"
          done < <(find "$package/usr/share/applications" -type f -name '*.desktop')
          mkdir -p artifacts
          dpkg-deb --root-owner-group -b "$package" "$RUNNER_TEMP/obidji-jugu.deb"
          zip -j artifacts/Obidji-Jugu-Linux.zip "$RUNNER_TEMP/obidji-jugu.deb"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Obidji-Jugu-${{ matrix.label }}
          path: artifacts/*.zip
          if-no-files-found: error
